# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0",
    "OFL-1.1", "Ubuntu-font-1.0", "CDLA-Permissive-2.0", "0BSD",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Never let OpenSSL sneak into the tree: we use rustls everywhere.
deny = [{ name = "openssl-sys" }, { name = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
