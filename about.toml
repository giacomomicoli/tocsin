# cargo-about configuration: https://embark.github.io/cargo-about/
# Builds THIRD-PARTY-LICENSES.html for the release zip. Keep `accepted` in
# step with the `allow` list in deny.toml.
accepted = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0",
    "OFL-1.1", "Ubuntu-font-1.0", "CDLA-Permissive-2.0", "0BSD",
]
# Only what ends up in the shipped Windows binary.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
