<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--bg-app);color:var(--text-1);font-family:var(--font-ui);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:4px;width:84px}
.chip{height:44px;border-radius:2px;border:1px solid rgba(128,110,80,.35)}
.n{font-size:11px;color:var(--text-2);font-family:var(--font-mono)}.l{font-size:12px}
.th{flex:1;padding:12px;background:var(--bg-app-gradient);display:flex;flex-direction:column;gap:6px}.b{padding:8px 10px;font-size:12px}</style></head><body><div style="display:flex;gap:10px"><div class="th" data-theme="void" style="color:var(--text-1)">
 <div class="b" style="background:var(--surface-frame-gradient);border:1px solid var(--border-frame);border-radius:4px;color:var(--text-title);font-family:var(--font-display)">Void · frame</div>
 <div class="b" style="background:var(--surface-row);border:1px solid var(--border-row);border-radius:2px">row <span style="color:var(--text-2)">· text-2</span></div>
 <div class="b" style="margin-left:24px;background:var(--surface-child);border:1px solid var(--border-row);border-radius:2px">child row <span style="color:var(--text-3)">· text-3</span></div></div><div class="th" data-theme="light" style="color:var(--text-1)">
 <div class="b" style="background:var(--surface-frame-gradient);border:1px solid var(--border-frame);border-radius:4px;color:var(--text-title);font-family:var(--font-display)">Sunwell · frame</div>
 <div class="b" style="background:var(--surface-row);border:1px solid var(--border-row);border-radius:2px">row <span style="color:var(--text-2)">· text-2</span></div>
 <div class="b" style="margin-left:24px;background:var(--surface-child);border:1px solid var(--border-row);border-radius:2px">child row <span style="color:var(--text-3)">· text-3</span></div></div></div></body></html>
