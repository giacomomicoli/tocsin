<!-- @dsCard group="Colors" viewport="700x150" name="Status colors" subtitle="One color per UpdateStatus, tuned per theme" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--bg-app);color:var(--text-1);font-family:var(--font-ui);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:4px;width:84px}
.chip{height:44px;border-radius:2px;border:1px solid rgba(128,110,80,.35)}
.n{font-size:11px;color:var(--text-2);font-family:var(--font-mono)}.l{font-size:12px}
.t{padding:12px;display:flex;gap:6px;flex-wrap:wrap;border:1px solid var(--border-row);background:var(--surface-row)}</style></head><body><div style="display:flex;flex-direction:column;gap:8px"><div class="t"><span style="font-family:var(--font-display);font-weight:600;font-size:11px;padding:3px 8px;border-radius:2px;color:var(--status-update);border:1px solid color-mix(in srgb,var(--status-update) 50%,transparent);background:color-mix(in srgb,var(--status-update) 12%,transparent)">UPDATE AVAILABLE</span><span style="font-family:var(--font-display);font-weight:600;font-size:11px;padding:3px 8px;border-radius:2px;color:var(--status-ok);border:1px solid color-mix(in srgb,var(--status-ok) 50%,transparent);background:color-mix(in srgb,var(--status-ok) 12%,transparent)">UP TO DATE</span><span style="font-family:var(--font-display);font-weight:600;font-size:11px;padding:3px 8px;border-radius:2px;color:var(--status-ahead);border:1px solid color-mix(in srgb,var(--status-ahead) 50%,transparent);background:color-mix(in srgb,var(--status-ahead) 12%,transparent)">AHEAD OF SOURCE</span><span style="font-family:var(--font-display);font-weight:600;font-size:11px;padding:3px 8px;border-radius:2px;color:var(--status-manual);border:1px solid color-mix(in srgb,var(--status-manual) 50%,transparent);background:color-mix(in srgb,var(--status-manual) 12%,transparent)">CHECK MANUALLY</span><span style="font-family:var(--font-display);font-weight:600;font-size:11px;padding:3px 8px;border-radius:2px;color:var(--status-error);border:1px solid color-mix(in srgb,var(--status-error) 50%,transparent);background:color-mix(in srgb,var(--status-error) 12%,transparent)">ERROR / MISSING</span><span style="font-family:var(--font-display);font-weight:600;font-size:11px;padding:3px 8px;border-radius:2px;color:var(--status-muted);border:1px solid color-mix(in srgb,var(--status-muted) 50%,transparent);background:color-mix(in srgb,var(--status-muted) 12%,transparent)">DISABLED / NOT CHECKED</span></div><div class="t" data-theme="light" style="background:var(--surface-row);border-color:var(--border-row)"><span style="font-family:var(--font-display);font-weight:600;font-size:11px;padding:3px 8px;border-radius:2px;color:var(--status-update);border:1px solid color-mix(in srgb,var(--status-update) 50%,transparent);background:color-mix(in srgb,var(--status-update) 12%,transparent)">UPDATE AVAILABLE</span><span style="font-family:var(--font-display);font-weight:600;font-size:11px;padding:3px 8px;border-radius:2px;color:var(--status-ok);border:1px solid color-mix(in srgb,var(--status-ok) 50%,transparent);background:color-mix(in srgb,var(--status-ok) 12%,transparent)">UP TO DATE</span><span style="font-family:var(--font-display);font-weight:600;font-size:11px;padding:3px 8px;border-radius:2px;color:var(--status-ahead);border:1px solid color-mix(in srgb,var(--status-ahead) 50%,transparent);background:color-mix(in srgb,var(--status-ahead) 12%,transparent)">AHEAD OF SOURCE</span><span style="font-family:var(--font-display);font-weight:600;font-size:11px;padding:3px 8px;border-radius:2px;color:var(--status-manual);border:1px solid color-mix(in srgb,var(--status-manual) 50%,transparent);background:color-mix(in srgb,var(--status-manual) 12%,transparent)">CHECK MANUALLY</span><span style="font-family:var(--font-display);font-weight:600;font-size:11px;padding:3px 8px;border-radius:2px;color:var(--status-error);border:1px solid color-mix(in srgb,var(--status-error) 50%,transparent);background:color-mix(in srgb,var(--status-error) 12%,transparent)">ERROR / MISSING</span><span style="font-family:var(--font-display);font-weight:600;font-size:11px;padding:3px 8px;border-radius:2px;color:var(--status-muted);border:1px solid color-mix(in srgb,var(--status-muted) 50%,transparent);background:color-mix(in srgb,var(--status-muted) 12%,transparent)">DISABLED / NOT CHECKED</span></div></div></body></html>
