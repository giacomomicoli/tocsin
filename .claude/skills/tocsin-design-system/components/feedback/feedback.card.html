<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);color:var(--text-1);font-family:var(--font-ui);font-size:13px}
.b{border:1px solid;border-radius:3px;line-height:1.3;white-space:nowrap;cursor:pointer;font-family:var(--font-ui);font-weight:500}
.sm{padding:5px 10px;font-size:12px}.md{padding:8px 14px;font-size:13px}.chip{padding:6px 12px;font-size:13px}
.p{background:var(--btn-primary-bg);border-color:var(--btn-primary-border);color:var(--btn-primary-text);font-family:var(--font-display);font-weight:600}
.p:hover{background:var(--btn-primary-bg-hover)}
.s{background:transparent;border-color:var(--btn-ghost-border);color:var(--btn-ghost-text)}.s:hover{background:var(--btn-ghost-bg-hover)}
.d{background:transparent;border-color:color-mix(in srgb,var(--status-error) 55%,transparent);color:var(--status-error)}
.sel{background:var(--btn-selected-bg);border-color:var(--btn-selected-border);color:var(--btn-selected-text);font-family:var(--font-display);font-weight:600}
.dis{opacity:.4;cursor:default}
.badge{font-family:var(--font-display);font-weight:600;font-size:11px;padding:3px 8px;border-radius:2px;white-space:nowrap}
.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.c{display:flex;flex-direction:column;gap:10px}
.n{font-size:11px;color:var(--text-3);font-family:var(--font-mono);width:70px}</style></head><body><div class="c"><div style="padding:12px 16px;border-radius:2px;border:1px solid color-mix(in srgb,var(--status-update) 60%,transparent);background:color-mix(in srgb,var(--status-update) 8%,transparent);display:flex;gap:16px;align-items:center"><div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--status-update)">Replace 2 folders?</span><span style="font-size:12px;color:var(--text-2)">The WeakAuras zip ships Ace3 and LibStub, which you already have.</span></div><button class="b sm p">Replace</button><button class="b sm s">Cancel</button></div>
<div class="r"><span style="flex:1;color:var(--text-2)">3 updates found · 1 needs attention.</span><button class="b sm s" style="padding:2px 8px">×</button></div>
<div class="r"><span style="flex:1;color:var(--status-error)">CurseForge did not answer. Try again in a moment.</span><button class="b sm s" style="padding:2px 8px">×</button></div>
<div class="r" style="gap:6px"><span style="width:6px;height:6px;transform:rotate(45deg);background:var(--accent)"></span><span style="width:6px;height:6px;transform:rotate(45deg);background:var(--border-control)"></span><span style="width:6px;height:6px;transform:rotate(45deg);background:var(--border-control)"></span><span style="margin-left:8px;color:var(--text-2);font-size:12px">Loading the WoWInterface catalog…</span></div></div></body></html>
