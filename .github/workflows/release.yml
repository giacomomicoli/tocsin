name: Release

on:
  push:
    tags: ["v*"]

# Each job asks for what it needs: the two builds sign their attestations,
# only `publish` writes to the release.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
      # Build provenance: id-token signs the attestation, attestations stores it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tocsin
      # MIT/Apache crates ask for their notices to ship with the binary.
      - name: Third-party licences
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          cargo about generate --manifest-path crates/tocsin/Cargo.toml --locked -o THIRD-PARTY-LICENSES.html about.hbs
      # A zip rather than a bare exe: the fonts compiled into the exe are under
      # the OFL, which asks for their licence texts to travel with them.
      - name: Package
        shell: pwsh
        run: |
          $name = "tocsin-$env:GITHUB_REF_NAME-windows-x64"
          New-Item -ItemType Directory -Path "$name/licenses" | Out-Null
          Copy-Item target/release/tocsin.exe "$name/"
          Copy-Item LICENSE "$name/LICENSE.txt"
          Copy-Item crates/tocsin/assets/fonts/OFL-*.txt "$name/licenses/"
          Copy-Item THIRD-PARTY-LICENSES.html "$name/licenses/"
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ZIP=$name.zip" | Out-File -Encoding ascii -Append $env:GITHUB_ENV
          "EXE=$name/tocsin.exe" | Out-File -Encoding ascii -Append $env:GITHUB_ENV
      # Proves the zip and the exe inside it were built by this workflow from
      # this commit; anyone can check with `gh attestation verify`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ env.ZIP }}
            ${{ env.EXE }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ${{ env.ZIP }}
          if-no-files-found: error

  linux:
    # The binary asks for the glibc of the machine that built it and won't
    # start on an older one, so this is the oldest Ubuntu GitHub still
    # offers (22.04, glibc 2.35), not `ubuntu-latest`. When this label goes
    # away, move to the next one and update the minimum glibc in the README
    # and in the check below.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      MAX_GLIBC: "2.35"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No apt step: every Linux dependency is pure Rust or loaded at run time
      # (Wayland, X11, libxkbcommon, libdbus), so nothing is linked but glibc.
      - run: cargo build --release -p tocsin
      - name: Third-party licences
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          cargo about generate --manifest-path crates/tocsin/Cargo.toml --locked -o THIRD-PARTY-LICENSES.html about.hbs
      # The README promises a minimum glibc and "nothing to install": fail
      # here, not on a user's machine, if a dependency starts breaking either.
      - name: Check what the binary needs
        run: |
          bin=target/release/tocsin
          needed=$(objdump -p "$bin" | awk '$1 == "NEEDED" { print $2 }')
          echo "$needed"
          extra=$(echo "$needed" | grep -Ev '^(libc|libm|libgcc_s|libdl|libpthread|librt|ld-linux-x86-64)\.so\.[0-9]+$' || true)
          if [ -n "$extra" ]; then
            echo "::error::tocsin links a library beyond glibc and libgcc: $extra"
            exit 1
          fi
          glibc=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "Newest glibc symbol: $glibc"
          if [ "$(printf '%s\n' "GLIBC_$MAX_GLIBC" "$glibc" | sort -V | tail -n 1)" != "GLIBC_$MAX_GLIBC" ]; then
            echo "::error::tocsin needs $glibc, newer than the documented $MAX_GLIBC"
            exit 1
          fi
      # A tarball keeps the executable bit, and carries the licence texts
      # (see the Windows job) plus what a Linux desktop needs to show the
      # app with its name and icon: Wayland compositors read them from a
      # .desktop file named after the window's application id.
      - name: Package
        run: |
          name="tocsin-$GITHUB_REF_NAME-linux-x64"
          mkdir -p "$name/licenses"
          cp target/release/tocsin LICENSE "$name/"
          cp crates/tocsin/assets/fonts/OFL-*.txt THIRD-PARTY-LICENSES.html "$name/licenses/"
          cp crates/tocsin/assets/linux/tocsin.desktop "$name/"
          cp crates/tocsin/assets/logo/tocsin-emblem-256.png "$name/tocsin.png"
          tar --owner=0 --group=0 --numeric-owner -czf "$name.tar.gz" "$name"
          echo "TARBALL=$name.tar.gz" >> "$GITHUB_ENV"
          echo "BIN=$name/tocsin" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ env.TARBALL }}
            ${{ env.BIN }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: ${{ env.TARBALL }}
          if-no-files-found: error

  # One release with every platform's archive, and one SHA256SUMS.txt for all
  # of them: nothing is published unless both builds succeeded.
  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # For the release notes only; the archives come from the jobs above.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # Written on Linux, so the line endings are LF and `sha256sum -c` can
      # read it (a trailing CR would be taken as part of the file name).
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum tocsin-*.zip tocsin-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/tocsin-*.zip
            dist/tocsin-*.tar.gz
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          # Every release page opens with what the app is, how to check the
          # download and why it isn't signed; the generated changelog follows.
          body_path: .github/release-notes.md
          generate_release_notes: true
